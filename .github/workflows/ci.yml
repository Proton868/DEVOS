name: CI - Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -q
        env:
          AUTH_ENABLED: "false"
          SUPABASE_URL: ""
          SUPABASE_KEY: ""
          OLLAMA_HOST: "http://localhost:11434"
          JWT_SECRET: "test-secret-key-for-ci-only-32chars-long"
          DEFAULT_PROVIDER: "ollama"

  frontend:
    name: Frontend Build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-src/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-src
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend-src
        run: npm run build
        env:
          CI: "true"

      - name: Verify build output
        run: |
          test -f frontend-src/build/index.html
          test -d frontend-src/build/static

  docker-build:
    name: Docker Build (all profiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build micro profile
        run: docker build --target micro -t caraios:micro-test .

      - name: Build standard profile
        run: docker build --target standard -t caraios:standard-test .

      - name: Build enterprise profile
        run: docker build --target enterprise -t caraios:enterprise-test .

  security-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements-lite.txt || true
