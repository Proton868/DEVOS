[pytest]
minversion = 7.0
addopts = -q
python_files = tests/test_*.py tests/real_runtime/test_*.py
markers =
    asyncio: mark test to run with asyncio event loop
    real_runtime: production-path tests that forbid DEVOS_ORCH_FAKE_RUNTIME
    fake_runtime: deterministic tests that may use DEVOS_ORCH_FAKE_RUNTIME
asyncio_mode = auto
