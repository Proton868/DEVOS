# Tauri Desktop App — Agency OS Master Plan §8
#
# CaraiOS desktop packaging via Tauri v2. The desktop app wraps the web UI
# in a native window with system tray, offline-first Micro profile, and
# auto-update support. This is the configuration scaffold — the actual
# Tauri Rust source lives in src-tauri/.
#
# To build the desktop app:
#   1. Install Tauri CLI: cargo install tauri-cli
#   2. Build frontend: npm run build (in frontend-src/)
#   3. Run: cargo tauri dev (or cargo tauri build for production)
#
# The Tauri app embeds the FastAPI backend as a sidecar process, so the
# full CaraiOS stack runs locally without any external dependencies.

[package]
name = "caraios"
version = "4.0.0"
description = "CaraiOS — Agency Operating System Desktop"
authors = ["CaraiOS"]
license = "MIT"
repository = "https://github.com/caraios/caraios"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "caraios_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true